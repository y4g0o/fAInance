services:
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    volumes:
      - ${HOME}/.local/share/personalos/personalos.db:/data/personalos.db:ro
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    profiles:
      - metabase

volumes:
  metabase-data:
