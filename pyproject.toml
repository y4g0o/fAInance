[project]
name = "personalos"
version = "0.2.4"
description = "PersonalOS — plataforma pessoal local e modular"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "ofxparse>=0.21",
    "openpyxl>=3.1",
    "numpy-financial>=1.0",  # juro embutido em parcelamento (rate/pmt) — aplicacao/analise.py
    "pdfplumber>=0.11",      # extrato em PDF: texto e tabela por coordenadas
    "fastapi>=0.115",        # API + painel local, no mesmo processo
    "uvicorn>=0.32",         # servidor ASGI
    "jinja2>=3.1",           # templates do painel
    "python-multipart>=0.0.9",  # upload de extrato pela tela (UploadFile)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.20", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
personalos = "personalos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
packages = ["personalos"]
mypy_path = "src"
disallow_untyped_defs = true
ignore_missing_imports = true
