<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PersonalOS">
  <!-- Sem gradiente e sem filtro de propósito: renderizador de ícone de sistema
       varia demais, e o que some em um deles é um ícone quebrado no menu. -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#12161c"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#39414d" stroke-width="2"/>

  <!-- Lançamentos: o histórico, discreto. -->
  <g fill="#4a5462">
    <rect x="13" y="43" width="20" height="3.5" rx="1.75"/>
    <rect x="13" y="35" width="13" height="3.5" rx="1.75"/>
  </g>

  <!-- O que sobra, subindo: o ponto da ferramenta. -->
  <path d="M15 41 L26 41 L26 32 L37 32 L37 21 L46 21"
        fill="none" stroke="#4ade80" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="46" cy="21" r="5" fill="#4ade80"/>
</svg>
